<!doctype html>
<html lang="ko"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
<title>모두의 내집마련</title>
<style>
:root{
  --ink:#1b2436; --ink-2:#465a75; --ink-3:#8090a4;
  --accent:#3466d6; --accent-soft:#e7edfb; --accent-ink:#284fb0;
  --paper:#f6f7f9; --card:#ffffff; --line:#e9edf2; --line-2:#f0f3f6;
  --grid:#e0e7ec;
  --brass:#b7842b; --brass-soft:#ecdcb8;
  --ok:#1e8f6e; --ok-soft:#d7ede4; --ok-ink:#146a51;
  --warn:#bf4d33; --warn-soft:#f3ddd4; --warn-ink:#8f3320;
  --ltv:#2c5c94; --dsr:#bf4d33; --cap:#6b46a8; --prod:#1e8f6e;
  --shadow:0 1px 2px rgba(18,41,63,.05), 0 8px 30px rgba(18,41,63,.06);
  --shadow-lg:0 4px 12px rgba(18,41,63,.08), 0 20px 50px rgba(18,41,63,.10);
  --mono:'SF Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper); line-height:1.64; font-size:16px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; background-position:-1px -1px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:750;letter-spacing:-.02em;color:var(--ink)}
button,input,select{font-family:inherit}
button{cursor:pointer}
.mono{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .tiny{font-size:13px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:30;background:rgba(243,245,244,.82);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.head-in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px;letter-spacing:-.03em}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--ink),#2a5486);position:relative;box-shadow:var(--shadow);flex:0 0 auto}
.logo .mark::before,.logo .mark::after{content:"";position:absolute;left:5px;right:5px;height:2px;border-radius:2px}
.logo .mark::before{top:11px;background:var(--brass-soft);transform:rotate(-22deg)}
.logo .mark::after{top:18px;background:var(--ok-soft);transform:rotate(16deg)}
.head-spacer{flex:1}
.badge{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.badge.stale .dot{background:var(--warn)}
.vsel{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px}

/* ---- mobile live bar ---- */
.livebar{display:none}

/* ---- app shell ---- */
.app{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:352px 1fr;gap:22px;align-items:start}
.inputs{display:flex;flex-direction:column;gap:14px;padding-right:4px}
.results{display:flex;flex-direction:column;gap:18px;min-width:0}
@media(max-width:920px){
  .app{grid-template-columns:1fr;padding:16px}
  .inputs{position:static;max-height:none;order:2}
  .results{order:1}
  .livebar{display:flex;position:sticky;top:57px;z-index:20;align-items:baseline;gap:10px;background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:12px;margin:0 0 4px;box-shadow:var(--shadow)}
  .livebar .d{font-weight:850;font-size:19px}
  .livebar .s{font-size:12px;opacity:.85;margin-left:auto}
}

/* ---- input panel ---- */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grp>summary,.grp>.grp-h{list-style:none;padding:13px 16px;display:flex;align-items:center;gap:9px;cursor:default;border-bottom:1px solid var(--line-2)}
details.grp>summary{cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
.grp-h .t,summary .t{font-weight:750;font-size:15px}
.grp-h .n,summary .n{font:800 10px/1 var(--mono);color:var(--brass);border:1px solid var(--brass-soft);border-radius:5px;padding:3px 5px;background:#fdf9f0}
details.grp>summary .chev{margin-left:auto;color:var(--ink-3);transition:transform .2s}
details.grp[open]>summary .chev{transform:rotate(90deg)}
.grp-b{padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:baseline}
.f label .h{font-size:12px;font-weight:500;color:var(--ink-3)}
.f input,.f select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15.5px;background:#fff;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.f input.n{text-align:right;font-variant-numeric:tabular-nums}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;padding-top:2px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.checks input{width:18px;height:18px;accent-color:var(--ok)}
.io{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:2px 2px 0}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 15px;font-size:13.5px;font-weight:700;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.98)} .btn:active{transform:translateY(1px)}
.btn.ink{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---- hero ---- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:22px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;opacity:.35;pointer-events:none;mask:linear-gradient(90deg,transparent,#000 60%)}
.hero-in{position:relative;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.hero .lead{font-size:14.5px;font-weight:700;color:var(--ink-2)}
.hero .date{font-size:54px;font-weight:850;letter-spacing:-.035em;line-height:.98;margin:4px 0 2px}
.hero .date.reach{color:var(--ok)} .hero .date.miss{color:var(--warn)}
.hero .sub{font-size:14.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hero .divider{width:1px;align-self:stretch;background:var(--line);min-height:56px}
.hero .side .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.hero .runway{margin-top:12px;position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .chip{font-size:13.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.hero .chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok-ink)}
.hero .chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(18,41,63,.03);padding:22px 24px}
.card>.ch{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.card h3{font-size:16.5px}
.card .n{font:800 11px/1 var(--mono);color:var(--brass);border:1px solid var(--brass-soft);border-radius:5px;padding:3px 5px;background:#fdf9f0}
.card .ch .sp{flex:1}

/* ---- chart ---- */
.chart-wrap{padding:6px 4px 2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:2px 6px 8px}
.legend .k{display:flex;gap:7px;align-items:center}
.legend .sw{width:16px;height:3px;border-radius:2px}
svg{display:block;width:100%;height:auto;overflow:visible}
.scn{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.scn button{border:none;background:#fff;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-2)}
.scn button.on{background:var(--ink);color:#fff}
.note{padding:2px 6px 4px;font-size:13px;color:var(--ink-3)}
.pv-bar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 4px 0;padding:9px 13px;border-radius:11px;background:#fbf6ea;border:1px solid var(--brass-soft)}
.pv-bar.on{display:flex}
.pv-bar .t{font-size:14.5px;font-weight:700}
.pv-bar .x{margin-left:auto;border:none;background:none;color:var(--ink-2);font-weight:800;cursor:pointer;font-size:13px}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:13px 15px}
.stat .l{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.stat .v{font-size:23px;font-weight:820;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.01em}
.pill.ltv{background:#eaf1fa;color:var(--ltv)} .pill.dsr{background:#fbeae4;color:var(--dsr)}
.pill.cap{background:#f1ebfb;color:var(--cap)} .pill.prod{background:#e2f4ec;color:var(--prod)}

/* ---- levers ---- */
.lev{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .05s;text-align:left;width:100%}
.lev:hover{border-color:var(--brass);box-shadow:var(--shadow)}
.lev:active{transform:translateY(1px)}
.lev.on{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.lev .top{display:flex;align-items:baseline;gap:8px}
.lev .rk{font:800 11px/1 var(--mono);color:var(--brass)}
.lev .nm{font-weight:750;font-size:14.5px}
.lev .sv{margin-left:auto;font-weight:850;font-variant-numeric:tabular-nums;font-size:15px}
.lev .sv.pos{color:var(--ok)} .lev .sv.neg,.lev .sv.zero{color:var(--ink-3)}
.lev .bar{height:6px;border-radius:4px;background:var(--paper);overflow:hidden}
.lev .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brass-soft),var(--brass))}
.lev .ds{font-size:13px;color:var(--ink-2)}
.lev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.lev-grid{grid-template-columns:1fr}}

/* ---- depth tabs ---- */
.tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:57px;background:var(--paper);z-index:10;padding:8px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:none;border-radius:11px;padding:8px 13px;font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{background:#eef2f7;color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:800}
@media(max-width:920px){.tabs{top:calc(57px + 40px)}}
.pane{display:none;padding-top:16px}
.pane.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.cols2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-2)}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.bind td{background:#fbeae4}
.tbl tr.bind td:first-child{font-weight:800;color:var(--warn)}
.tbl tr.tot td{font-weight:850;border-top:2px solid var(--ink);border-bottom:none}
.stat-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.stat-row:last-child{border-bottom:none} .stat-row .v{font-weight:750;font-variant-numeric:tabular-nums}
.conf{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:5px}
.conf.high{background:var(--ok-soft);color:var(--ok-ink)} .conf.medium{background:#f6ecc9;color:#8a6516} .conf.low{background:var(--warn-soft);color:var(--warn-ink)}
.warn-note{font-size:13px;color:var(--warn-ink);background:var(--warn-soft);border-radius:9px;padding:9px 12px;margin-top:10px}
.ok-note{font-size:13px;color:var(--ok-ink);background:var(--ok-soft);border-radius:9px;padding:9px 12px;margin-top:10px}
/* roadmap */
.route-cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rc{flex:1;min-width:210px;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.rc.main{border:1.5px solid var(--ok);background:#f4fbf8}
.ms{display:flex;gap:13px}
.ms .col{display:flex;flex-direction:column;align-items:center}
.ms .g{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--line);background:#fff;color:var(--ink-3)}
.ms .g.pass{border-color:var(--ok);background:var(--ok);color:#fff}
.ms .g.fail{border-color:var(--warn);color:var(--warn)}
.ms .stem{width:2px;flex:1;background:var(--line);min-height:12px}
.ms:last-child .stem{display:none}
.ms .b{padding-bottom:14px;flex:1}
.ms .b .t{font-weight:750;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ms .b .c{font:800 11px/1 var(--mono);color:var(--brass)}
.ms .b .cd{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.ms .b .cd.fail{color:var(--warn)}
.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.task:last-child{border-bottom:none}
.task input{margin-top:2px;width:16px;height:16px;accent-color:var(--ok)}
.task .tt{font-weight:700;font-size:14.5px} .task .wy{font-size:13px;color:var(--ink-2);margin-top:2px}
.task .wy b{color:var(--brass)} .task .du{font:700 12px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.anchor{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;margin-bottom:12px;flex-wrap:wrap}
.anchor .d{font-weight:850;font-size:20px;font-variant-numeric:tabular-nums}
.anchor .rw{margin-left:auto;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.phase{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.phase .h{display:flex;align-items:baseline;gap:10px;padding:10px 14px;background:#f8faf9;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.phase .h .pn{font-weight:800;font-size:15px}
.phase .h .rg{font:700 12.5px/1 var(--mono);color:var(--ink-3);margin-left:auto}
.phase .h .dd{font:800 11px/1 var(--mono);color:var(--brass);border:1px solid var(--brass-soft);border-radius:5px;padding:3px 6px;background:#fdf9f0}
.phase ul{margin:0;padding:9px 15px 11px;list-style:none}
.phase ul li{font-size:13.5px;padding:4px 0 4px 18px;position:relative}
.phase ul li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--brass-soft)}
.phase ul li.star{font-weight:750} .phase ul li.star::before{background:var(--warn);width:6px;height:6px;top:9px}
/* ledger */
.lform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.lform .f{min-width:120px}
.rate{font-weight:850;font-variant-numeric:tabular-nums}
.rate.good{color:var(--ok)} .rate.bad{color:var(--warn)}
.rate.warn{color:#b07d18}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:#f8faf9;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-top:12px}
.code{white-space:pre-wrap;font:12px/1.5 var(--mono);background:#0f1b2a;color:#d7e0ea;border-radius:11px;padding:14px 16px;margin-top:10px;overflow:auto;max-height:320px}
.flag{color:var(--warn);font-weight:800}
/* 초보자 도움말 · 쉬운 요약 */
.intro{display:flex;gap:12px;align-items:flex-start;background:#eef5fb;border:1px solid #cfe0f0;border-radius:14px;padding:14px 16px;font-size:14.5px;color:#274b6d;line-height:1.55}
.intro.hide{display:none}
.intro .ic{font-size:20px;line-height:1;flex:0 0 auto}
.intro b{color:#1b3a58}
.intro .x{margin-left:auto;border:none;background:none;color:#5a7a97;font-weight:800;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;flex:0 0 auto}
.summary{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
.summary h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.summary p{margin:0;font-size:16px;line-height:1.7;color:var(--ink)}
.summary p+p{margin-top:9px}
.summary .hl{font-weight:850}
.summary .hl.ok{color:var(--ok-ink)} .summary .hl.warn{color:var(--warn-ink)} .summary .hl.brass{color:var(--brass)}
.gloss{border-bottom:1px dotted var(--ink-3);cursor:help}
.legend .plain{width:100%;color:var(--ink-3);font-size:12.5px;padding-top:2px}
/* 프리셋 */
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;align-items:center;transition:filter .15s,border-color .15s}
.preset:hover{border-color:var(--brass);filter:brightness(.99)}
.preset .em{font-size:14px}
.preset-h{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin:0 2px 8px}
/* 슬라이더 */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--line);outline:none;margin-top:3px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid #fff;box-shadow:0 1px 4px rgba(18,41,63,.3);cursor:pointer}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid #fff;box-shadow:0 1px 4px rgba(18,41,63,.3);cursor:pointer}
.f .rng{margin-top:6px}
/* 모바일에서도 뜨는 툴팁 */
.tip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);font-size:11px;font-weight:800;margin-left:5px;cursor:pointer;vertical-align:middle;padding:0}
#tipbubble{position:fixed;z-index:100;max-width:260px;background:var(--ink);color:#fff;font-size:13px;line-height:1.5;padding:10px 13px;border-radius:11px;box-shadow:var(--shadow-lg);display:none}
#tipbubble.on{display:block;animation:fade .12s ease}
#tipbubble::after{content:"";position:absolute;bottom:-6px;left:var(--ax,20px);width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
/* 레버 적용 버튼 */
.pv-bar .apply{border:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:800;cursor:pointer;margin-left:4px}
.ced{margin-top:10px}.ced-h{font-size:12px;color:var(--ink-2);font-weight:700;margin-bottom:4px}.ced svg{background:#fbfcfc;border:1px solid var(--line);border-radius:10px;touch-action:none}.ced .pt{fill:var(--brass);stroke:#fff;stroke-width:2;cursor:ns-resize}.ced .pl{stroke:var(--brass);stroke-width:2;fill:none}.ced .lbl{font:700 10px var(--mono);fill:var(--ink-3)}
/* 히트맵 */
.heat{border-collapse:collapse;font-size:12px;width:100%}.heat td,.heat th{border:1px solid #fff;text-align:center;padding:7px 4px;font-variant-numeric:tabular-nums}.heat th{background:none;color:var(--ink-3);font-weight:700;font-size:11px}.heat td{color:#12293f;font-weight:700}.heat .axis{color:var(--ink-3);font-weight:700;font-size:11px}
/* 비교 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp .col{padding:14px 16px}.cmp .col+.col{border-left:1px solid var(--line)}
.cmp .h{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cmp .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.cmp .row .v{font-weight:750;font-variant-numeric:tabular-nums}
.slot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.slot .nm{font-weight:700}.slot .meta{font-size:12px;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}
.win{color:var(--ok-ink);font-weight:800}


footer{max-width:1240px;margin:8px auto 0;padding:18px 22px 60px}
.disc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.link-list{display:flex;flex-direction:column;gap:8px}
.olink{display:block;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none;transition:border-color .15s,background .15s}
.olink:hover{border-color:var(--brass);background:#fffdf8}
.olink b{display:block;color:var(--ink);font-size:14px}
.olink span{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.olink::after{content:"↗";float:right;color:var(--ink-3);font-weight:700;margin-top:-18px}
/* 초보자 3단계 가이드 */
.guide{position:relative;background:linear-gradient(180deg,#eef5fb,#f5f9fd);border:1px solid #cfe0f0;border-radius:16px;padding:16px 18px}
.guide.hide{display:none}
.guide .x{position:absolute;top:10px;right:12px;border:none;background:none;color:#5a7a97;font-weight:800;cursor:pointer;font-size:17px}
.g-h{font-size:15px;color:#1b3a58;margin-bottom:12px}
.g-h b{color:#12293f}
.g-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g-step{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #dbe8f4;border-radius:12px;padding:11px 12px}
.g-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.g-step b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.g-step span span,.g-step>div>span{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.5}
@media(max-width:760px){.g-steps{grid-template-columns:1fr}}
/* 청약 배점 바 */
.gauge{margin:10px 0}
.gauge .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.gauge .lab .v{font-weight:800;font-variant-numeric:tabular-nums}
.gauge .track{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.gauge .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brass),#d8a949)}
.gauge.big .track{height:18px}
.gauge.big .fill{background:linear-gradient(90deg,var(--ok),#3fae86)}
.cutline{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cutline .c{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.sgrid{grid-template-columns:1fr}}
.sgrid .box{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff}
.sgrid .box b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:3px}
.sgrid .box span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.lead-note{background:var(--accent-soft);border:1px solid #d4e0f8;color:var(--accent-ink);border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.55;margin-bottom:16px}
.lead-note b{color:var(--accent-ink)}
.olink:hover{border-color:var(--accent)}
.olink::after{content:"↗";float:right;color:var(--accent);font-weight:800;margin-top:-18px}
.g-n{background:var(--accent)}
.badge .dot{background:var(--accent)}
.hero-art-wrap{position:absolute;inset:0;pointer-events:none}
.hero-art{position:absolute;right:-6px;bottom:-4px;width:min(50%,440px);height:auto;opacity:.24;z-index:0}
.hero .hero-in{position:relative;z-index:1}
@media(max-width:640px){.hero-art{opacity:.14;width:62%}}

.region-row{display:flex;gap:8px}
.region-row select{flex:1;min-width:0}
.reg-note{margin-top:7px;font-size:12.5px;line-height:1.5;padding:8px 11px;border-radius:10px}
.reg-note.reg{background:var(--warn-soft);border:1px solid #eec7bb;color:var(--warn-ink)}
.reg-note.free{background:var(--ok-soft);border:1px solid #bfe3d5;color:var(--ok-ink)}
.reg-note b{font-weight:800}
.simple-toggle{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border:1px solid var(--accent-soft);background:#f4f7fe;border-radius:11px;font-size:13px;color:var(--ink-2);cursor:pointer;flex-wrap:wrap}
.simple-toggle input{width:17px;height:17px;accent-color:var(--accent)}
.simple-toggle b{color:var(--accent-ink)}
.simple-toggle span{flex-basis:100%;font-size:11.5px;color:var(--ink-3);padding-left:25px}
body.simple [data-adv]{display:none}

.topnav{position:sticky;top:56px;z-index:20;background:rgba(244,248,253,.86);backdrop-filter:blur(10px);border-bottom:1px solid rgba(52,102,214,.10)}
.topnav-in{padding:9px 0}
.topnav .tabs{gap:3px;position:static;top:auto;padding:0;background:none;border:none}

.chk{padding:4px 0}
.chk label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.5}
.chk input{width:17px;height:17px;margin-top:1px;accent-color:var(--ok);flex:0 0 auto}

.pane-intro{background:#f4f7fe;border:1px solid var(--accent-soft);color:var(--ink-2);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
.pane-intro b{color:var(--accent-ink)}

.sc-list{display:flex;flex-direction:column;gap:10px}
.sc-item{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.sc-item:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(52,102,214,.1)}
.sc-top{display:flex;align-items:center;gap:10px}
.sc-rk{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sc-nm{font-weight:750;color:var(--ink);font-size:14.5px;flex:1}
.sc-sv{font-weight:800;color:var(--ok-ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.sc-item .bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin:9px 0 6px}
.sc-item .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#3fae86)}
.sc-ds{font-size:12.5px;color:var(--ink-2)}
.sc-ds b{color:var(--accent-ink)}
.legal p{font-size:13px;line-height:1.65;color:var(--ink-2);margin:0 0 9px}
.legal b{color:var(--ink)}
.card.hi{border-color:var(--accent-soft);background:linear-gradient(180deg,#f7faff,#fff)}
.mgoal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--ok-soft);border:1px solid #bfe3d5}
.mgoal>span:first-child{font-size:13px;color:var(--ink-2)}
.mgoal b{font-size:16px;color:var(--ok-ink)}
.mgoal .tiny{flex-basis:100%}

@media print{
  header,.topnav,.inputs,.livebar,.guide,.pv-bar,.scn,.simple-toggle,footer,.io,.tip{display:none!important}
  .app{display:block;padding:0;max-width:100%}
  .card{break-inside:avoid;box-shadow:none;border-color:#ccc}
  body{background:#fff!important}
  #analysisCore{display:block!important}
  .print-sum{margin-top:6px;font-size:13px;color:#222;line-height:1.7}
  .print-sum b{color:#000}
  a[href]:after{content:""}
}

.cmp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.cmp3{grid-template-columns:1fr}}
.cbox{border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center;background:#fff}
.cbox.win{border-color:var(--ok);background:#f2faf7}
.cbox .ct{font-weight:750;font-size:13.5px;color:var(--ink)}
.cbox .cv{font-size:22px;font-weight:850;color:var(--accent-ink);margin:4px 0}
.cbox .cv span{font-size:12px;font-weight:600;color:var(--ink-2);margin-left:2px}
.cbox .cd{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.track.guides{position:relative}
.track.guides .gl{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);opacity:.55}
.track.guides .gl.reg{background:var(--warn);opacity:.7}


/* ===== 핸드폰 최적화 ===== */
@media(max-width:560px){
  .head-in{padding:10px 14px;gap:9px}
  .logo{font-size:15.5px}
  .app{padding:11px}
  .results{gap:13px}
  .card{padding:16px 14px;border-radius:14px}
  .topnav-in{padding:6px 8px}
  .topnav .tabs{gap:2px}
  .topnav .tabs button{padding:9px 12px;font-size:13.5px;border-radius:10px}
  .f input,.f select{padding:13px 12px;font-size:16px}
  .f label{font-size:13px}
  .btn,button.btn{min-height:44px;font-size:14.5px}
  button{touch-action:manipulation}
  h3{font-size:15px}
  .pane-intro{font-size:13px;padding:10px 12px}
  .stats{grid-template-columns:1fr}
  .region-row{flex-direction:column;gap:10px}
  .region-row .f{flex-basis:100%!important;max-width:100%!important}
  .cmp3{grid-template-columns:1fr}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:7px 6px}
  .card{overflow-x:auto}
  .gauge.big .v{font-size:18px!important}
  .mgoal{flex-direction:column;align-items:flex-start;gap:4px}
  .mgoal button{margin-left:0!important}
}
@media(max-width:380px){
  .topnav .tabs button{padding:8px 10px;font-size:13px}
  .card{padding:14px 12px}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.print-head{display:none}
@media print{.print-head{display:block;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #333}.print-head h1{font-size:20px;margin:0}.print-head .pd{font-size:12px;color:#555}}

/* 좌/우 패널 구분 */
.inputs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;box-shadow:0 1px 2px rgba(18,41,63,.04);position:sticky;top:66px;align-self:start}
.tabs{background:rgba(244,248,253,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;top:57px;padding:9px 8px}
.results .tabs{margin-bottom:-4px}
@media(max-width:920px){ .inputs{position:static;border-radius:14px} }

/* 좌측 패널 초보자 개편 — 평탄화·단일열·깔끔 */
.inputs{overflow-x:hidden;padding-right:0;gap:2px}
.inputs>.grp{background:none;border:none;box-shadow:none;border-radius:0;overflow:visible;border-top:1px solid var(--line-2);margin:0}
.inputs>.grp:first-child{border-top:none}
.inputs>.grp>summary,.inputs>.grp>.grp-h{padding:15px 2px 9px;border-bottom:none;gap:8px;cursor:default}
.inputs>.grp .grp-h .n,.inputs>.grp summary .n{display:none}
.inputs>.grp .grp-h .t{font-size:14.5px;font-weight:800;color:var(--ink)}
.inputs>.grp .grp-b{grid-template-columns:1fr;gap:12px;padding:2px 2px 10px}
.inputs .grp-b>*{min-width:0}
.inputs .f label{font-size:13px;color:var(--ink-2)}
.inputs .preset-h{margin:2px 2px 9px;font-size:11.5px}
.inputs .presets{gap:7px}

.cmp.cmp-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:760px){.cmp,.cmp.cmp-3{grid-template-columns:1fr}.cmp .col+.col{border-left:none;border-top:1px solid var(--line)}}

.tabbar{display:flex;align-items:center;gap:4px;position:sticky;top:57px;z-index:10;background:rgba(244,248,253,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;padding:6px 6px;margin-bottom:-4px}

;background-size:600px auto,100% auto,100% 100%;background-attachment:fixed,fixed,fixed;background-color:#eef1f6;min-height:100vh}
/* ===== 가독성 향상 ===== */
:root{--ink-3:#6d7d95}
body{font-size:15px;line-height:1.62}
.tiny,.muted{font-size:13.5px}
.f label{font-size:13.5px;color:var(--ink-2);font-weight:600}
.f input,.f select{font-size:15.5px}
.card h3{font-size:17px;letter-spacing:-.2px}
.inputs>.grp .grp-h .t{font-size:15px}
.row span,.cmp .row span{font-size:14px}
.tbl{font-size:13.5px}
.reg-note,.ok-note,.warn-note{font-size:14px;line-height:1.62}
.pane-intro{font-size:14px;line-height:1.6}
.note{font-size:13px;color:var(--ink-2)}
.cbox .cd{font-size:12.5px;color:var(--ink-2)}
header{background:rgba(247,250,253,.94)!important;backdrop-filter:saturate(1.1) blur(10px)}
.tabbar{background:rgba(247,250,253,.96)!important}
/* E1 가정 투명화 */
.asmp{display:flex;flex-direction:column;gap:14px}
.asmp-g{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.asmp-h{font-weight:800;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.asmp-r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line-2)}
.asmp-r>span{color:var(--ink-2);font-size:13.5px}
.asmp-r>b{font-size:14.5px;text-align:right;white-space:nowrap}
.asmp-r>i{grid-column:1/-1;font-style:normal;font-size:12px;color:var(--ink-3)}
.badge-law,.badge-off,.badge-est,.badge-usr{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.badge-law{background:#e7f6ef;color:var(--ok-ink)}
.badge-off{background:#e7edfb;color:var(--accent-ink)}
.badge-est{background:#fbf1df;color:#9a6a12}
.badge-usr{background:#f0f1f4;color:var(--ink-2)}
@media(max-width:560px){.asmp-r>b{font-size:13.5px}}
/* ===== E3 접근성 ===== */
:root{--ink-3:#5c6c85}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs button:focus-visible,.tabnav:focus-visible,.btn:focus-visible,a:focus-visible,.tip:focus-visible,.preset:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.tip{cursor:help}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}

.sky-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 2px rgba(18,41,63,.06);transition:background .15s}
.sky-btn:hover{background:var(--accent-soft)}
/* 관심 지역 칩 */
.fav-chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.fav-chip>button{border:none;background:none;color:var(--accent-ink);font-weight:700;cursor:pointer;padding:2px 2px;font-size:12.5px}
.fav-chip>button.x{color:var(--ink-3);font-size:15px;line-height:1;padding:0 5px}
.fav-chip>button.x:hover{color:var(--warn)}

/* ===== 가독성: 배경 위 카드 대비 강화 ===== */
.card{box-shadow:0 2px 12px rgba(18,41,63,.07)!important;border-color:#e3e8ef}
.inputs{box-shadow:0 2px 12px rgba(18,41,63,.07)!important}
header{background:rgba(247,250,253,.975)!important}
.tabbar{background:rgba(247,250,253,.985)!important}
.mgoal{background:#fff}
/* 표(실거래가 등) 배경 불투명 보장 */
.tbl{background:#fff}

/* 아침 테마 */
body.morning{--sky-grad:linear-gradient(180deg,#f7cfa6 0,#efc9c2 20%,#d3dcee 52%,#e6eff8 100%)}
.app{position:relative;z-index:1}
/* ===== 역동적 배경 ===== */
.bg-anim{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-anim .cloud{position:absolute;height:20px;background:#fff;border-radius:20px;opacity:.5;box-shadow:15px 7px 0 -3px #fff,-15px 7px 0 -3px #fff,32px 4px 0 -6px #fff}
.bg-anim .c1{top:9%;width:66px;animation:bgDrift 95s linear infinite}
.bg-anim .c2{top:19%;width:48px;opacity:.38;animation:bgDrift 135s linear infinite;animation-delay:-50s}
.bg-anim .c3{top:6%;width:58px;opacity:.44;animation:bgDrift 115s linear infinite;animation-delay:-80s}
@keyframes bgDrift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
.bg-anim .tl{position:absolute;width:3px;height:3px;border-radius:1px;background:#ffdf9e;opacity:0;box-shadow:0 0 5px 1px rgba(255,223,158,.8);animation:twinkle 5s ease-in-out infinite}
.bg-anim .t1{left:14%;bottom:120px;animation-delay:-.2s}.bg-anim .t2{left:22%;bottom:150px;animation-delay:-1.4s}.bg-anim .t3{left:37%;bottom:135px;animation-delay:-2.6s}.bg-anim .t4{left:58%;bottom:160px;animation-delay:-3.1s}.bg-anim .t5{left:71%;bottom:128px;animation-delay:-1.9s}.bg-anim .t6{left:84%;bottom:145px;animation-delay:-3.8s}
@keyframes twinkle{0%,100%{opacity:0}45%,55%{opacity:.85}}
body.night .bg-anim .tl{animation-name:twinkleNight}
@keyframes twinkleNight{0%,100%{opacity:.18}45%,55%{opacity:1}}
.bg-anim .train{position:absolute;bottom:40px;left:0;animation:bgTrain 18s linear infinite}
.bg-anim .train .tbody{position:relative;width:230px;height:28px;border-radius:7px 14px 14px 7px;background:linear-gradient(#5a93d4,#3d72af);box-shadow:0 4px 10px rgba(18,41,63,.16);animation:chug .18s ease-in-out infinite}
.bg-anim .train .tbody::after{content:"";position:absolute;top:6px;bottom:9px;left:10px;right:22px;background:repeating-linear-gradient(90deg,#cfe6f7 0 12px,transparent 12px 22px);border-radius:2px;opacity:.92}
.bg-anim .train .tbody::before{content:"";position:absolute;right:0;top:0;bottom:0;width:16px;background:#f2c14e;border-radius:0 14px 14px 0;box-shadow:inset -2px 0 0 #d9a92f}
@keyframes bgTrain{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 60px))}}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.bg-anim .car{position:absolute;bottom:12px;width:46px;height:15px}
.bg-anim .car .body{position:absolute;inset:0;border-radius:6px 8px 4px 4px;box-shadow:0 3px 6px rgba(18,41,63,.16)}
.bg-anim .car .body::before{content:"";position:absolute;left:10px;right:12px;top:-6px;height:9px;border-radius:6px 6px 0 0;background:inherit}
.bg-anim .car .body::after{content:"";position:absolute;left:12px;right:14px;top:-4px;height:6px;border-radius:2px;background:#d3e8f7;opacity:.85}
.bg-anim .car .w{position:absolute;bottom:-4px;width:9px;height:9px;border-radius:50%;background:#23272e;border:2px solid #6b7480;animation:spin .45s linear infinite}
.bg-anim .car .w::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:#aeb6c0}
.bg-anim .car .w1{left:5px}.bg-anim .car .w2{right:5px}
.bg-anim .car .hl{position:absolute;bottom:4px;width:6px;height:4px;border-radius:50%;background:#ffe08a;filter:blur(1px);opacity:.85}

.bg-anim .cA{animation:bgCarR 13s linear infinite}.bg-anim .cA .body{background:linear-gradient(#e6663f,#c9502e)}.bg-anim .cA .hl{right:-2px}
.bg-anim .cB{animation:bgCarR 17s linear infinite;animation-delay:-6s}.bg-anim .cB .body{background:linear-gradient(#4a6f9c,#3a5a84)}.bg-anim .cB .hl{right:-2px}

@keyframes bgCarR{from{transform:translateX(-70px)}to{transform:translateX(calc(100vw + 70px))}}
@keyframes bgCarL{from{transform:translateX(calc(100vw + 70px)) scaleX(-1)}to{transform:translateX(-70px) scaleX(-1)}}
.bg-anim .walker{position:absolute;bottom:20px}

.bg-anim .walker .person .head{position:absolute;top:-6px;left:1.4px;width:5.2px;height:5.2px;border-radius:50%;background:#e6c6a0}
.bg-anim .walker .person .torso{position:absolute;top:0;left:0;width:8px;height:9px;border-radius:3px 3px 1px 1px}
.bg-anim .walker .person .leg{position:absolute;bottom:-5px;width:3px;height:6px;background:#3a4450;border-radius:0 0 1px 1px;transform-origin:top center}
.bg-anim .walker .person .l{left:1px;animation:legA .5s ease-in-out infinite}

@keyframes legA{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}

.bg-anim .wA{animation:bgWalkR 28s linear infinite}.bg-anim .wA .torso{background:#4a6f9c}
.bg-anim .wB{animation:bgWalkL 36s linear infinite;animation-delay:-8s}.bg-anim .wB .torso{background:#c05a50}
.bg-anim .wC{animation:bgWalkR 42s linear infinite;animation-delay:-20s}.bg-anim .wC .torso{background:#5f8a6a}
.bg-anim .wD{animation:bgWalkL 32s linear infinite;animation-delay:-27s}.bg-anim .wD .torso{background:#7a5a86}

@keyframes bgWalkR{from{transform:translateX(-24px)}to{transform:translateX(calc(100vw + 24px))}}
